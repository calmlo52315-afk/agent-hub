services:
  # ── Gateway (Go) ──────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - GATEWAY_PORT=8080
      - RUNTIME_URL=http://runtime:8001
      - FRONTED_URL=http://fronted:3000
      - DEMO_ACCESS_TOKEN=demo-access-token
    depends_on:
      runtime:
        condition: service_healthy
      fronted:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ── Runtime (Python FastAPI) ──────────────────────────────
  runtime:
    build:
      context: .
      dockerfile: runtime/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - RUNTIME_PORT=8001
      - CODING_MODEL=doubao-code-preview
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
    restart: unless-stopped

  # ── Fronted (Next.js) ─────────────────────────────────────
  fronted:
    build:
      context: .
      dockerfile: fronted/Dockerfile
      args:
        NEXT_PUBLIC_GATEWAY_BASE_URL: http://localhost:8080
        NEXT_PUBLIC_GATEWAY_WS_URL: ws://localhost:8080
        NEXT_PUBLIC_DEMO_ACCESS_TOKEN: demo-access-token
        GATEWAY_PROXY_TARGET: http://gateway:8080
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      runtime:
        condition: service_healthy
    restart: unless-stopped
