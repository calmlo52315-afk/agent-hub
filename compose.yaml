services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: AgentHub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d AgentHub"]
      interval: 5s
      timeout: 5s
      retries: 5

  runtime:
    build:
      context: .
      dockerfile: runtime/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RUNTIME_HOST: 0.0.0.0
      RUNTIME_PORT: ${RUNTIME_PORT:-8001}
      RUNTIME_INTERNAL_TOKEN: ${RUNTIME_INTERNAL_TOKEN:-runtime-internal-token}
      ORCHESTRATOR_BASE_URL: ${ORCHESTRATOR_BASE_URL:-}
      ORCHESTRATOR_API_KEY: ${ORCHESTRATOR_API_KEY:-}
      ORCHESTRATOR_MODEL: ${ORCHESTRATOR_MODEL:-}
      REPLAY_STORE_BACKEND: ${REPLAY_STORE_BACKEND:-postgres}
      REPLAY_POSTGRES_DSN: ${REPLAY_POSTGRES_DSN:-postgres://postgres:123456@postgres:5432/AgentHub?sslmode=disable}
      METRICS_STORE_BACKEND: ${METRICS_STORE_BACKEND:-postgres}
    ports:
      - "${RUNTIME_PORT:-8001}:8001"
    volumes:
      - ./artifacts:/app/artifacts
    env_file:
      - .env
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      runtime:
        condition: service_started
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT:-8080}
      GATEWAY_STORE_BACKEND: ${GATEWAY_STORE_BACKEND:-postgres}
      GATEWAY_SQLITE_PATH: /app/data/gateway.db
      GATEWAY_POSTGRES_DSN: ${GATEWAY_POSTGRES_DSN:-postgres://postgres:123456@postgres:5432/AgentHub?sslmode=disable}
      RUNTIME_BASE_URL: http://runtime:${RUNTIME_PORT:-8001}
      RUNTIME_INTERNAL_TOKEN: ${RUNTIME_INTERNAL_TOKEN:-runtime-internal-token}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./gateway/data:/app/data
    restart: unless-stopped

  fronted:
    build:
      context: .
      dockerfile: fronted/Dockerfile
      args:
        GATEWAY_PROXY_TARGET: ${GATEWAY_PROXY_TARGET:-http://gateway:8080}
        NEXT_PUBLIC_GATEWAY_BASE_URL: ${NEXT_PUBLIC_GATEWAY_BASE_URL:-}
        NEXT_PUBLIC_GATEWAY_WS_URL: ${NEXT_PUBLIC_GATEWAY_WS_URL:-}
        NEXT_PUBLIC_DEMO_ACCESS_TOKEN: ${NEXT_PUBLIC_DEMO_ACCESS_TOKEN:-demo-access-token}
    depends_on:
      - gateway
    environment:
      PORT: 3000
      GATEWAY_PROXY_TARGET: ${GATEWAY_PROXY_TARGET:-http://gateway:8080}
      NEXT_PUBLIC_GATEWAY_BASE_URL: ${NEXT_PUBLIC_GATEWAY_BASE_URL:-}
      NEXT_PUBLIC_GATEWAY_WS_URL: ${NEXT_PUBLIC_GATEWAY_WS_URL:-}
      NEXT_PUBLIC_DEMO_ACCESS_TOKEN: ${NEXT_PUBLIC_DEMO_ACCESS_TOKEN:-demo-access-token}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  pgdata:
